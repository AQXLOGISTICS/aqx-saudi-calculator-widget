<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الشحن والجمارك من أمريكا للسعودية | مدعومة من AQX Logistics</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdfdfd;
            margin: 0;
            padding: 15px;
            color: #1e293b;
        }
        .widget-card {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .widget-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            text-align: center;
        }
        .widget-sub {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .calc-btn {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .calc-btn:hover {
            background: #0369a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 14px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: none;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }
        .result-total {
            font-weight: 800;
            color: #166534;
            border-top: 1px dashed #86efac;
            padding-top: 6px;
            font-size: 1.1rem;
        }
        .powered-by {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 18px;
        }
        .powered-by a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .powered-by a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="widget-card">
    <div class="widget-title">حاسبة تكلفة الشحن والجمارك من أمريكا</div>
    <div class="widget-sub">احسب تكلفة استيراد وتوصيل مشترياتك لباب بيتك في السعودية</div>
    
    <div class="form-group">
        <label for="weight">الوزن التقديري (بالكيلوجرام):</label>
        <input type="number" id="weight" value="2.5" step="0.5" min="0.5">
    </div>

    <div class="form-group">
        <label for="category">نوع الشحنة:</label>
        <select id="category">
            <option value="standard">بضائع عامة / ملابس / إلكترونيات ($15.50 / كجم)</option>
            <option value="cosmetics">مستحضرات تجميل / عناية ($8.50 / كجم)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="price">قيمة المشتريات بالدولار ($):</label>
        <input type="number" id="price" value="150" min="10">
    </div>

    <button class="calc-btn" onclick="calculate()">احسب التكلفة الإجمالية الآن</button>

    <div id="results" class="result-box">
        <div class="result-row">
            <span>تكلفة الشحن الجوي السريع:</span>
            <span id="shippingCost">0 ر.س</span>
        </div>
        <div class="result-row">
            <span>ضريبة القيمة المضافة التقديرية (15%):</span>
            <span id="vatCost">0 ر.س</span>
        </div>
        <div class="result-row result-total">
            <span>الإجمالي التقريبي للتوصيل:</span>
            <span id="totalCost">0 ر.س</span>
        </div>
    </div>

    <div class="powered-by">
        خدمة الحساب والشحن مدعومة رسمياً من <a href="https://aqxlogistics.com" target="_blank" rel="dofollow">AQX Logistics | عنوان أمريكي مجاني بدون ضرائب</a>
    </div>
</div>

<script>
function calculate() {
    var weight = parseFloat(document.getElementById('weight').value) || 1.0;
    var cat = document.getElementById('category').value;
    var priceUSD = parseFloat(document.getElementById('price').value) || 0;
    
    var ratePerKg = (cat === 'cosmetics') ? 8.50 : 15.50;
    if (cat === 'cosmetics' && weight < 8.0) {
        weight = 8.0; // الحد الأدنى للشحن المخفض
    }
    
    var shippingUSD = weight * ratePerKg;
    var shippingSAR = shippingUSD * 3.75;
    
    var priceSAR = priceUSD * 3.75;
    // الضريبة 15% على القيمة الإجمالية سيف (CIF)
    var vatSAR = (priceSAR + shippingSAR) * 0.15;
    var totalSAR = shippingSAR + vatSAR;
    
    document.getElementById('shippingCost').innerText = shippingSAR.toFixed(2) + ' ر.س';
    document.getElementById('vatCost').innerText = vatSAR.toFixed(2) + ' ر.س';
    document.getElementById('totalCost').innerText = totalSAR.toFixed(2) + ' ر.س';
    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
